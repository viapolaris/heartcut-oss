<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartcut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar" id="top"></header>
<nav class="steps" id="steps" aria-label="Steps" hidden></nav>
<div id="app" style="display:contents"></div>
<footer class="foot" id="foot" hidden></footer>
<div id="overlay"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">Heartcut needs JavaScript.</p></noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
